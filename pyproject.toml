[project]
name = "yolo-streamlit-detection-tracking"
version = "2.1.0"
description = "YOLO Vision Studio: detection, segmentation, pose, open-vocabulary prompts and tracking with YOLO26, YOLOE, YOLO World v2, RT-DETR and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
# Keep in step with requirements.txt (pip users) — same packages, same lower bounds.
dependencies = [
    "ultralytics>=8.4.116",     # YOLO26, YOLOE-26, RT-DETR, YOLO World v2 and the trackers (brings torch, torchvision, opencv)
    "streamlit>=1.50",
    "streamlit-webrtc>=0.64.5", # browser webcam
    "av>=14",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "yt-dlp>=2026.2.4",         # YouTube source
    "lapx>=0.5.12",             # linear assignment for the trackers
    "onnxruntime>=1.20",        # only for the yolo26*-reid.onnx ReID encoders; CPU build, works everywhere
    "clip @ git+https://github.com/ultralytics/CLIP.git",  # YOLO World v2 text encoder
]

[tool.uv]
package = false  # application project: install the dependencies only, not the project as a package

[dependency-groups]
# installed by a plain `uv sync`: run the playground notebook (docs/) and the tests
dev = ["ipykernel>=6.29", "pytest>=8"]
# opt-in, for local RF-DETR experiments: `uv sync --group rfdetr` (doesn't change any of the app's versions)
rfdetr = ["rfdetr>=1.4.2", "supervision>=0.27"]
